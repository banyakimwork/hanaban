<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김반야 강의 모음</title>
<meta name="description" content="김반야의 AI·SNS 강의 모음. 듣고 싶은 강의를 골라 주세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="김반야 강의 모음">
<meta property="og:description" content="나만의 AI-OS 만들기 · SNS운영 실전 워크숍">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root {
    --bg: #F2F4F6;
    --card: #FFFFFF;
    --text: #191F28;
    --sub: #4E5968;
    --muted: #8B95A1;
    --line: #E5E8EB;
    --blue: #3182F6;
    --blue-soft: #E8F3FF;
    --green: #03B26C;
    --green-soft: #E5F8EF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101113;
      --card: #1C1D21;
      --text: #F2F4F6;
      --sub: #B0B8C1;
      --muted: #8B95A1;
      --line: #2C2E33;
      --blue: #4C94F7;
      --blue-soft: #1A2A42;
      --green: #2FCB8A;
      --green-soft: #15302A;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
    min-height: 100vh;
  }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 28px; }

  header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%; flex: 0 0 48px;
    background: var(--blue); color: #fff;
    display: grid; place-items: center;
    font-size: 20px; font-weight: 700;
  }
  h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
  .role { font-size: 14px; color: var(--sub); margin-top: 2px; }
  .pick { font-size: 14px; color: var(--muted); margin-bottom: 10px; }

  .card {
    display: block;
    background: var(--card);
    border-radius: 18px;
    padding: 16px 18px;
    margin-bottom: 10px;
    text-decoration: none;
    color: inherit;
    border: 1px solid var(--line);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.06); }
  .card:active { transform: scale(.98); }

  .top { display: flex; align-items: center; gap: 8px; }
  .tag {
    flex: 0 0 auto;
    font-size: 12px; font-weight: 600;
    padding: 3px 8px; border-radius: 6px;
  }
  .tag.ai { background: var(--blue-soft); color: var(--blue); }
  .tag.sns { background: var(--green-soft); color: var(--green); }

  h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; }
  .desc { font-size: 14px; color: var(--sub); line-height: 1.45; margin-top: 6px; }

  ul.facts { list-style: none; margin-top: 8px; }
  ul.facts li { font-size: 13px; color: var(--sub); line-height: 1.45; display: flex; gap: 6px; }
  ul.facts b { color: var(--muted); font-weight: 500; flex: 0 0 auto; }

  .btn {
    margin-top: 12px;
    display: flex; align-items: center; justify-content: center;
    height: 44px; border-radius: 12px;
    font-size: 15px; font-weight: 600; color: #fff;
  }
  .ai .btn, .card.ai .btn { background: var(--blue); }
  .card.sns .btn { background: var(--green); }

  footer { text-align: center; font-size: 13px; color: var(--muted); margin-top: 28px; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <header>
    <div class="avatar">반</div>
    <div>
      <h1>김반야</h1>
      <p class="role">AI · SNS 마케팅 강의</p>
    </div>
  </header>
  <p class="pick">듣고 싶은 강의를 골라 주세요.</p>

  <a class="card ai" href="https://wiiskey.github.io/ai-os/" target="_blank" rel="noopener">
    <div class="top"><span class="tag ai">AI 입문</span><h2>나만의 AI-OS 만들기</h2></div>
    <p class="desc">클로드 코드로 나만의 AI 작업환경을 하루에 세팅해요.</p>
    <ul class="facts">
      <li><b>일정</b>12/5(토) · 12/19(토) · 7시간</li>
      <li><b>강사</b>위한솔 · 김반야</li>
    </ul>
    <span class="btn">강의 소개 보고 신청하기</span>
  </a>

  <a class="card sns" href="https://www.latpeed.com/products/YRhX1" target="_blank" rel="noopener">
    <div class="top"><span class="tag sns">SNS 운영</span><h2>SNS운영 실전 워크숍</h2></div>
    <p class="desc">크리에이터 · 브랜드 SNS 담당자를 위한 실습 워크숍이에요.</p>
    <ul class="facts">
      <li><b>일정</b>12/10(목) 오후 5~9시</li>
      <li><b>장소</b>강남역 인근 · 15명</li>
    </ul>
    <span class="btn">신청하기</span>
  </a>

  <footer>신청 · 결제는 각 강의 페이지에서 진행돼요.</footer>
</main>
</body>
</html>
